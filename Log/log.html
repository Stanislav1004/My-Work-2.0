<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log.Programming</title>
    <link rel="stylesheet" href="log.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
    <link rel="icon" href="../Img/favicon-32x32.png" type="image/png">
</head>
<body>
   <main>
    <form onsubmit="return checkform(this)">
    <h1><i>Log in</i></h1>
    <input type="text" name="user" placeholder="User name"><br>
    <input type="email" name="email" placeholder="Print email"><br>
    <input type="password" name="pass" placeholder="Print Password"><br>
    <div class="radio-group">
        <label><input type="radio" name="radio" value="male"> Man</label>
        <label><input type="radio" name="radio" value="female"> Woman</label>
      </div>      
    <span id="error"></span>
    <button>To send</button>
    </form></main>
    <script src="log.js"></script>
</body>
</html>
