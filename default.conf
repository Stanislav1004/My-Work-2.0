server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    # Не вибивати порт 8080 при редиректі
    absolute_redirect off;

    # При вході на http://localhost:8080 робимо редирект у папку Log
    location = / {
        return 302 /Log/log.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}